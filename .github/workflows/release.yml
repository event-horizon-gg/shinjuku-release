# Shared release workflow for every app listed in Shinjuku.
#
# This repo is public so public app repos can call it; it holds no secrets and
# no app data. The Catalog itself stays in the private shinjuku-catalog repo.
#
# Each app builds its own .app however it likes (build-command); this workflow
# then packages it as <name>-<version>-mac.zip, publishes the GitHub Release,
# and writes the app's entry into the Catalog. Triggered by a vX.Y.Z tag in
# the app's repo; a tag with a suffix (v1.4.0-beta.1) becomes a Beta Release.
name: Shinjuku release

on:
  workflow_call:
    inputs:
      build-command:
        description: Shell command that builds the .app
        required: true
        type: string
      app-path:
        description: Path to the built .app, relative to the repo root
        required: true
        type: string
      runs-on:
        description: Runner label (use self-hosted if GitHub's runners lack the SDK you need)
        required: false
        type: string
        default: macos-latest
      node-version:
        description: Set up this Node.js version before building (Electron apps)
        required: false
        type: string
        default: ""
      metadata-path:
        description: Path to the app's shinjuku.json
        required: false
        type: string
        default: shinjuku.json
    secrets:
      catalog-app-id:
        required: true
      catalog-app-key:
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must look like v1.4.0 or v1.4.0-beta.1 (got '$tag')"
            exit 1
          fi
          version="${tag#v}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: inputs.node-version != ''
        with:
          node-version: ${{ inputs.node-version }}

      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
          SHINJUKU_VERSION: ${{ steps.version.outputs.version }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"

      - name: Package
        id: package
        env:
          APP_PATH: ${{ inputs.app-path }}
          METADATA_PATH: ${{ inputs.metadata-path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          [[ -d "$APP_PATH" && "$APP_PATH" == *.app ]] || { echo "::error::$APP_PATH is not a built .app"; exit 1; }
          plist="$APP_PATH/Contents/Info.plist"
          app_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          if [[ "$app_version" != "$VERSION" ]]; then
            echo "::error::The app says it is version $app_version but the tag says $VERSION. Shinjuku reads the version from the app, so they must match. Set CFBundleShortVersionString from \$SHINJUKU_VERSION in your build."
            exit 1
          fi
          name=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["name"])' "$METADATA_PATH")
          xattr -cr "$APP_PATH"
          if ! codesign --verify --deep --strict "$APP_PATH" 2>/dev/null; then
            echo "Not validly signed; applying an ad-hoc signature"
            codesign --force --deep --sign - "$APP_PATH"
          fi
          asset="${name}-${VERSION}-mac.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$bundle_id" >> "$GITHUB_OUTPUT"
          echo "app_file=$(basename "$APP_PATH")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.package.outputs.asset }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          else
            flags=(--generate-notes --verify-tag)
            [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
            gh release create "$GITHUB_REF_NAME" "$ASSET" "${flags[@]}"
          fi

      - name: Get Catalog write token
        id: catalog-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.catalog-app-id }}
          private-key: ${{ secrets.catalog-app-key }}
          owner: ${{ github.repository_owner }}
          repositories: shinjuku-catalog

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/shinjuku-catalog
          token: ${{ steps.catalog-token.outputs.token }}
          path: .shinjuku-catalog

      # The entry writer lives next to this workflow, in the public
      # shinjuku-release repo. Callers use @main, so fetch main too.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/shinjuku-release
          ref: main
          path: .shinjuku-release

      - name: Write Catalog entry
        env:
          METADATA_PATH: ${{ inputs.metadata-path }}
          BUNDLE_ID: ${{ steps.package.outputs.bundle_id }}
          APP_FILE: ${{ steps.package.outputs.app_file }}
        run: |
          set -euo pipefail
          cd .shinjuku-catalog
          git config user.name "shinjuku-catalog[bot]"
          git config user.email "shinjuku-catalog[bot]@users.noreply.github.com"
          # Another app may release at the same moment: start from the latest
          # Catalog each attempt and retry the push.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 "$GITHUB_WORKSPACE/.shinjuku-release/scripts/upsert_entry.py" \
              --catalog-dir . \
              --metadata "$GITHUB_WORKSPACE/$METADATA_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle-id "$BUNDLE_ID" \
              --app-file "$APP_FILE"
            git add -A
            if git diff --cached --quiet; then
              echo "Catalog already up to date"
              exit 0
            fi
            git commit -m "Update ${GITHUB_REPOSITORY#*/} entry for $GITHUB_REF_NAME"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "::error::Could not write the Catalog after 5 attempts"
          exit 1
