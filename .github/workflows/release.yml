# Shared release workflow for every app listed in Shinjuku.
#
# This repo is public so public app repos can call it; it holds no secrets and
# no app data. The Catalog itself stays in the private shinjuku-catalog repo.
#
# Each app builds its own .app however it likes (build-command); this workflow
# then packages it as <name>-<version>-mac.zip (or, for iPhone apps, a Simulator
# build as <name>-<version>-ios-simulator.zip), publishes the GitHub Release,
# and writes the app's entry into the Catalog. Triggered by a vX.Y.Z tag in
# the app's repo; a tag with a suffix (v1.4.0-beta.1) becomes a Beta Release.
name: Shinjuku release

on:
  workflow_call:
    inputs:
      build-command:
        description: Shell command that builds the .app
        required: true
        type: string
      app-path:
        description: Path to the built .app, relative to the repo root
        required: true
        type: string
      platform:
        description: "mac, or ios for an iPhone app: build-command then builds it for the iOS Simulator (Shinjuku runs it there)"
        required: false
        type: string
        default: mac
      runs-on:
        description: Runner label (use self-hosted if GitHub's runners lack the SDK you need)
        required: false
        type: string
        default: macos-latest
      node-version:
        description: Set up this Node.js version before building (Electron apps)
        required: false
        type: string
        default: ""
      swift-version:
        description: Install this swift.org toolchain and build with it (e.g. 6.4.2), when the runner's Xcode is too old
        required: false
        type: string
        default: ""
      metadata-path:
        description: Path to the app's shinjuku.json
        required: false
        type: string
        default: shinjuku.json
    secrets:
      catalog-app-id:
        required: true
      catalog-app-key:
        required: true
      signing-p12:
        description: Base64 .p12 of the "Event Horizon Releases" identity (scripts/make-signing-identity.sh). Without it, apps are ad-hoc signed.
        required: false
      signing-password:
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes need the previous tag

      # Scripts that live next to this workflow (notes, Catalog entry). Callers use @main.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/shinjuku-release
          ref: main
          path: .shinjuku-release

      - name: Read version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must look like v1.4.0 or v1.4.0-beta.1 (got '$tag')"
            exit 1
          fi
          version="${tag#v}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: inputs.node-version != ''
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install Swift ${{ inputs.swift-version }}
        if: inputs.swift-version != ''
        env:
          SWIFT_VERSION: ${{ inputs.swift-version }}
        run: |
          set -euo pipefail
          [[ "$SWIFT_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::swift-version must look like 6.4.2"; exit 1; }
          curl -fsSL -o "$RUNNER_TEMP/swift.pkg" \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/xcode/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-osx.pkg"
          sudo installer -pkg "$RUNNER_TEMP/swift.pkg" -target /
          id=$(plutil -extract CFBundleIdentifier raw "/Library/Developer/Toolchains/swift-${SWIFT_VERSION}-RELEASE.xctoolchain/Info.plist")
          echo "TOOLCHAINS=$id" >> "$GITHUB_ENV"
          TOOLCHAINS="$id" swift --version

      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
          SHINJUKU_VERSION: ${{ steps.version.outputs.version }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"

      - name: Package
        id: package
        env:
          APP_PATH: ${{ inputs.app-path }}
          PLATFORM: ${{ inputs.platform }}
          METADATA_PATH: ${{ inputs.metadata-path }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNING_P12: ${{ secrets.signing-p12 }}
          SIGNING_PASSWORD: ${{ secrets.signing-password }}
        run: |
          set -euo pipefail
          [[ -d "$APP_PATH" && "$APP_PATH" == *.app ]] || { echo "::error::$APP_PATH is not a built .app"; exit 1; }
          case "$PLATFORM" in
            mac) plist="$APP_PATH/Contents/Info.plist" ;;
            ios) plist="$APP_PATH/Info.plist" ;;
            *) echo "::error::platform must be mac or ios, not $PLATFORM"; exit 1 ;;
          esac
          app_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          if [[ "$app_version" != "$VERSION" ]]; then
            echo "::error::The app says it is version $app_version but the tag says $VERSION. Shinjuku reads the version from the app, so they must match. Set CFBundleShortVersionString from \$SHINJUKU_VERSION in your build."
            exit 1
          fi
          name=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["name"])' "$METADATA_PATH")
          xattr -cr "$APP_PATH"
          if [[ "$PLATFORM" == ios ]]; then
            # The Simulator only needs an ad-hoc signature, which keeps any entitlements working.
            platform=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$plist" 2>/dev/null || true)
            [[ "$platform" == iPhoneSimulator ]] || { echo "::error::$APP_PATH is built for '$platform', not the iOS Simulator. Build with -destination 'generic/platform=iOS Simulator'."; exit 1; }
            codesign --verify --deep --strict "$APP_PATH" 2>/dev/null || codesign --force --deep --sign - "$APP_PATH"
          elif [[ -n "$SIGNING_P12" ]]; then
            # One fixed identity for every release, so macOS keeps Keychain approvals across updates.
            keychain="$RUNNER_TEMP/signing.keychain-db"
            keychain_password="$(openssl rand -hex 16)"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 900 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
            security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$SIGNING_PASSWORD" -T /usr/bin/codesign >/dev/null
            rm -f "$RUNNER_TEMP/signing.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
            # codesign only looks in keychains on the search list; sign by fingerprint, since a
            # self-signed identity counts as "not trusted" and isn't matched by name everywhere.
            original_keychains=$(security list-keychains -d user | tr -d '"')
            security list-keychains -d user -s "$keychain" $original_keychains
            security find-identity "$keychain"
            identity=$(security find-certificate -c "Event Horizon Releases" -Z "$keychain" | awk '/SHA-1/ {print $3}')
            [[ -n "$identity" ]] || { echo "::error::The signing .p12 has no 'Event Horizon Releases' certificate"; exit 1; }
            codesign --force --deep --keychain "$keychain" --sign "$identity" "$APP_PATH"
            security list-keychains -d user -s $original_keychains
            security delete-keychain "$keychain"
            codesign -d -r- "$APP_PATH" 2>&1 | grep designated
          elif ! codesign --verify --deep --strict "$APP_PATH" 2>/dev/null; then
            echo "Not validly signed; applying an ad-hoc signature"
            codesign --force --deep --sign - "$APP_PATH"
          fi
          codesign --verify --deep --strict "$APP_PATH"
          if [[ "$PLATFORM" == ios ]]; then asset="${name}-${VERSION}-ios-simulator.zip"; else asset="${name}-${VERSION}-mac.zip"; fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$bundle_id" >> "$GITHUB_OUTPUT"
          echo "app_file=$(basename "$APP_PATH")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.package.outputs.asset }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # A real changelog: CHANGELOG.md's section, else the commits since the last tag.
          # Never GitHub's generated notes, which are often just a compare link.
          bash .shinjuku-release/scripts/release-notes.sh "$GITHUB_REF_NAME" . > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
            # Releases made by an app's own job (Astral) keep their notes only if they list changes.
            body=$(gh release view "$GITHUB_REF_NAME" --json body -q .body)
            if ! grep -qE '^[[:space:]]*[-*] ' <<<"$body"; then
              gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
            fi
          else
            flags=(--notes-file "$RUNNER_TEMP/notes.md" --verify-tag)
            [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
            gh release create "$GITHUB_REF_NAME" "$ASSET" "${flags[@]}"
          fi

      - name: Get Catalog write token
        id: catalog-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.catalog-app-id }}
          private-key: ${{ secrets.catalog-app-key }}
          owner: ${{ github.repository_owner }}
          repositories: shinjuku-catalog

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/shinjuku-catalog
          token: ${{ steps.catalog-token.outputs.token }}
          path: .shinjuku-catalog

      - name: Write Catalog entry
        env:
          METADATA_PATH: ${{ inputs.metadata-path }}
          BUNDLE_ID: ${{ steps.package.outputs.bundle_id }}
          APP_FILE: ${{ steps.package.outputs.app_file }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          cd .shinjuku-catalog
          git config user.name "shinjuku-catalog[bot]"
          git config user.email "shinjuku-catalog[bot]@users.noreply.github.com"
          # Another app may release at the same moment: start from the latest
          # Catalog each attempt and retry the push.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 "$GITHUB_WORKSPACE/.shinjuku-release/scripts/upsert_entry.py" \
              --catalog-dir . \
              --metadata "$GITHUB_WORKSPACE/$METADATA_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle-id "$BUNDLE_ID" \
              --app-file "$APP_FILE" \
              --platform "$PLATFORM"
            git add -A
            if git diff --cached --quiet; then
              echo "Catalog already up to date"
              exit 0
            fi
            git commit -m "Update ${GITHUB_REPOSITORY#*/} entry for $GITHUB_REF_NAME"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "::error::Could not write the Catalog after 5 attempts"
          exit 1
